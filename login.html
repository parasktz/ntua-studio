<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Είσοδος διαχειριστή — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&subset=greek&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Studio Βιντεοσκόπησης</div>
  <div class="session-title" id="topSessionTitle"></div>
  <div class="spacer"></div>
  <nav>
    <a href="index.html">Αίτηση</a>
    <a href="schedule.html">Χρονοπρογραμματισμός</a>
    <a href="login.html" class="active">Διαχείριση</a>
  </nav>
</header>

<main class="wrap narrow">
  <h1>Είσοδος διαχειριστή</h1>
  <p class="sub">Συνδεθείτε με τα στοιχεία διαχειριστή όπως έχουν αποθηκευτεί στο Firebase Authentication.</p>
  <div class="card">
    <div id="loginErr" class="msg-err hidden"></div>
    <form id="formLogin">
      <label for="admEmail">Email</label>
      <input type="email" id="admEmail" required autocomplete="username">
      <label for="admPass">Κωδικός</label>
      <input type="password" id="admPass" required autocomplete="current-password">
      <div class="btn-row">
        <button class="btn" type="submit">Σύνδεση</button>
        <button class="btn secondary" type="button" onclick="location.href='index.html'">Πίσω</button>
      </div>
    </form>
  </div>
</main>

<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
const isAdmin = async uid => !!(await db.ref("admins/" + uid).get()).val();

/* Αν είναι ήδη συνδεδεμένος διαχειριστής, μετάβαση στον πίνακα */
auth.onAuthStateChanged(async u => {
  if (u && await isAdmin(u.uid)) location.href = "admin.html";
});

$("formLogin").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("loginErr");
  err.classList.add("hidden");
  try {
    const cred = await auth.signInWithEmailAndPassword($("admEmail").value.trim(), $("admPass").value);
    if (await isAdmin(cred.user.uid)) { location.href = "admin.html"; return; }
    await auth.signOut();
    err.textContent = "Ο λογαριασμός δεν έχει δικαιώματα διαχειριστή. Οι χρήστες συνδέονται στη σελίδα «Χρονοπρογραμματισμός».";
    err.classList.remove("hidden");
  } catch (e2) {
    err.textContent = "Αποτυχία σύνδεσης: λανθασμένο email ή κωδικός.";
    err.classList.remove("hidden");
  }
});
</script>
</body>
</html>
