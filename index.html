<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTUA STUDIO — Κρατήσεις βιντεοσκόπησης</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap&subset=greek" rel="stylesheet">
<style>
  :root{
    --bg:#17181B; --panel:#1F2125; --panel-2:#26292E;
    --line:#33373D; --text:#ECEAE4; --muted:#9BA0A8;
    --rec:#E23B32; --rec-press:#C7332B; --ok:#4CAF7D;
    --radius:6px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Commissioner', system-ui, sans-serif;
    font-size:16px; line-height:1.55;
    min-height:100vh;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }

  .wrap{ max-width:960px; margin:0 auto; padding:28px 20px 64px; }

  /* ── Header ─────────────────────────────── */
  header{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
          border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:26px; }
  .rec-dot{ width:11px; height:11px; border-radius:50%; background:var(--rec);
            align-self:center; flex:none; animation:pulse 2.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .rec-dot{ animation:none; } }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  h1{ font-size:1.45rem; font-weight:700; letter-spacing:.02em; }
  .subtitle{ color:var(--muted); font-size:1rem; }

  .notes{ color:var(--muted); margin-bottom:24px; max-width:64ch; }

  /* ── Layout ─────────────────────────────── */
  .grid{ display:grid; grid-template-columns:minmax(280px,340px) 1fr; gap:22px; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .panel{ background:var(--panel); border:1px solid var(--line);
          border-radius:var(--radius); padding:18px; }
  .panel h2{ font-size:.95rem; font-weight:500; color:var(--muted); margin-bottom:12px; }

  /* ── Ημερολόγιο ─────────────────────────── */
  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-nav button{ background:none; border:1px solid var(--line); color:var(--text);
                   border-radius:var(--radius); width:34px; height:34px; cursor:pointer; font-size:1rem; }
  .cal-nav button:disabled{ opacity:.3; cursor:default; }
  .cal-nav .month{ font-weight:500; }
  .cal{ width:100%; border-collapse:collapse; table-layout:fixed; }
  .cal th{ font-size:.75rem; font-weight:400; color:var(--muted); padding:4px 0; }
  .cal td{ padding:2px; text-align:center; }
  .cal td button{
    width:100%; aspect-ratio:1; border:1px solid transparent; background:none;
    color:var(--text); border-radius:var(--radius); cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:.85rem;
  }
  .cal td button:hover:not(:disabled){ border-color:var(--line); background:var(--panel-2); }
  .cal td button:disabled{ color:#565B63; cursor:default; }
  .cal td button.today{ text-decoration:underline; text-underline-offset:3px; }
  .cal td button.active{ background:var(--rec); border-color:var(--rec); color:#fff; font-weight:600; }

  /* ── Slots ──────────────────────────────── */
  .slots-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .slots-head .picked-date{ font-weight:500; }
  .slots-head .limit{ color:var(--muted); font-size:.85rem; }
  .slot-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
  .slot{
    padding:10px 8px; border-radius:var(--radius); cursor:pointer; text-align:center;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    font-family:'JetBrains Mono', monospace; font-size:.85rem;
  }
  .slot:hover:not(:disabled){ border-color:var(--muted); }
  .slot.selected{ background:var(--rec); border-color:var(--rec); color:#fff; font-weight:600; }
  .slot:disabled{
    cursor:default; color:#6A6F77; border-color:#2B2E33;
    background:repeating-linear-gradient(45deg, var(--panel) 0 6px, #212327 6px 12px);
    text-decoration:line-through;
  }
  .slot.blocked:disabled{ text-decoration:none; border-style:dashed; background:var(--panel); }
  .slot:focus-visible, .cal td button:focus-visible, .cal-nav button:focus-visible,
  input:focus-visible, .submit:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .empty-hint{ color:var(--muted); }

  /* ── Φόρμα ──────────────────────────────── */
  form{ margin-top:22px; border-top:1px solid var(--line); padding-top:18px; }
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; min-height:28px; }
  .chip{ font-family:'JetBrains Mono', monospace; font-size:.78rem; padding:3px 10px;
         border:1px solid var(--rec); border-radius:99px; color:var(--text); }
  .field{ margin-bottom:12px; }
  label{ display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input{
    width:100%; padding:10px 12px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--bg); color:var(--text);
    font-family:inherit; font-size:.95rem;
  }
  .submit{
    margin-top:8px; width:100%; padding:13px; border:none; border-radius:var(--radius);
    background:var(--rec); color:#fff; font-family:inherit; font-size:1rem; font-weight:700;
    cursor:pointer;
  }
  .submit:hover:not(:disabled){ background:var(--rec-press); }
  .submit:disabled{ opacity:.45; cursor:default; }

  /* ── Μηνύματα ───────────────────────────── */
  .banner{ border:1px solid var(--line); border-left:3px solid var(--rec);
           border-radius:var(--radius); background:var(--panel); padding:12px 14px;
           margin-bottom:20px; font-size:.92rem; }
  .msg{ margin-top:14px; padding:12px 14px; border-radius:var(--radius); font-size:.92rem; display:none; }
  .msg.ok{ display:block; background:#1D2A22; border:1px solid var(--ok); }
  .msg.err{ display:block; background:#2C1D1C; border:1px solid var(--rec); }
  .msg ul{ margin:6px 0 0 18px; }
  .code-big{ font-family:'JetBrains Mono', monospace; font-weight:600; letter-spacing:.08em;
             background:var(--panel-2); padding:2px 8px; border-radius:4px; }

  /* ── Διαχείριση κράτησης ───────────────── */
  .manage{ margin-top:22px; }
  .manage-hint{ color:var(--muted); font-size:.92rem; margin-bottom:14px; max-width:72ch; }
  .manage-row{ display:flex; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .manage-row input{ max-width:230px; text-transform:uppercase;
                     font-family:'JetBrains Mono', monospace; letter-spacing:.06em; }
  .btn{ padding:10px 18px; border-radius:var(--radius); border:1px solid var(--line);
        background:var(--panel-2); color:var(--text); cursor:pointer;
        font-family:inherit; font-size:.95rem; }
  .btn:hover{ border-color:var(--muted); }
  .btn:focus-visible, .m-cancel:focus-visible{ outline:2px solid var(--text); outline-offset:2px; }
  .m-item{ display:flex; align-items:center; justify-content:space-between; gap:10px;
           padding:10px 2px; border-bottom:1px solid var(--panel-2); flex-wrap:wrap; }
  .m-item .when{ font-family:'JetBrains Mono', monospace; font-size:.92rem; }
  .m-cancel{ padding:6px 14px; border-radius:var(--radius); border:1px solid var(--rec);
             background:none; color:var(--text); cursor:pointer; font-family:inherit; font-size:.85rem; }
  .m-cancel:hover{ background:var(--rec); }
  .m-locked{ color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="rec-dot" aria-hidden="true"></span>
    <h1 id="title">NTUA STUDIO</h1>
    <span class="subtitle" id="subtitle">Χρονοπρογραμματισμός βιντεοσκόπησης</span>
  </header>

  <div class="banner" id="setupBanner" style="display:none">
    Η σελίδα δεν έχει συνδεθεί ακόμα με το Firebase. Άνοιξε το <span class="mono">config.json</span>
    και συμπλήρωσε τα στοιχεία του project σου (δες README).
  </div>

  <p class="notes" id="notes"></p>

  <div class="grid">
    <!-- Ημερολόγιο -->
    <section class="panel" aria-label="Επιλογή ημερομηνίας">
      <h2>Ημερομηνία</h2>
      <div class="cal-nav">
        <button type="button" id="prevMonth" aria-label="Προηγούμενος μήνας">‹</button>
        <span class="month" id="monthLabel"></span>
        <button type="button" id="nextMonth" aria-label="Επόμενος μήνας">›</button>
      </div>
      <table class="cal" id="calendar"></table>
    </section>

    <!-- Slots + φόρμα -->
    <section class="panel" aria-label="Επιλογή ώρας και στοιχεία">
      <div class="slots-head">
        <span class="picked-date" id="pickedDate">Διάλεξε πρώτα ημερομηνία</span>
        <span class="limit" id="limitLabel"></span>
      </div>
      <div class="slot-grid" id="slotGrid">
        <p class="empty-hint">Τα διαθέσιμα slots θα εμφανιστούν εδώ.</p>
      </div>

      <form id="bookingForm" novalidate>
        <div class="chips" id="chips"></div>
        <div class="field">
          <label for="name">Ονοματεπώνυμο *</label>
          <input id="name" type="text" autocomplete="name" required>
        </div>
        <div class="field" id="emailField">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="email">
        </div>
        <div class="field" id="phoneField">
          <label for="phone">Τηλέφωνο επικοινωνίας</label>
          <input id="phone" type="tel" autocomplete="tel">
        </div>
        <button class="submit" id="submitBtn" type="submit" disabled>Κράτηση</button>
        <div class="msg" id="msg" role="status"></div>
      </form>
    </section>
  </div>

  <!-- Διαχείριση υπάρχουσας κράτησης -->
  <section class="panel manage" aria-label="Διαχείριση κράτησης">
    <h2>Έχεις ήδη κράτηση;</h2>
    <p class="manage-hint" id="manageHint"></p>
    <div class="manage-row">
      <input id="manageCode" type="text" placeholder="π.χ. K7F3-Q9ZM" autocomplete="off"
             aria-label="Κωδικός διαχείρισης">
      <button class="btn" id="manageFind" type="button">Εύρεση</button>
    </div>
    <div id="manageResults" aria-live="polite"></div>
  </section>
</div>

<script type="module">
/* ─────────────────────────────────────────────────────────────
   NTUA STUDIO — Κρατήσεις slots βιντεοσκόπησης
   Όλες οι ρυθμίσεις (ημερομηνίες, ώρες, διάρκεια slot, εξαιρέσεις)
   βρίσκονται στο config.json — δεν χρειάζεται αλλαγή στον κώδικα.
   ───────────────────────────────────────────────────────────── */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, runTransaction, get, remove }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const MONTHS = ["Ιανουάριος","Φεβρουάριος","Μάρτιος","Απρίλιος","Μάιος","Ιούνιος",
                "Ιούλιος","Αύγουστος","Σεπτέμβριος","Οκτώβριος","Νοέμβριος","Δεκέμβριος"];
const DAYS   = ["Δευ","Τρί","Τετ","Πέμ","Παρ","Σάβ","Κυρ"];

const $ = id => document.getElementById(id);

let config, db;
let viewYear, viewMonth;            // μήνας που δείχνει το ημερολόγιο
let selectedDate = null;            // "YYYY-MM-DD"
let selectedSlots = new Set();      // slot ids π.χ. "09-00"
let takenSlots = new Set();
let blockedSlots = new Set();       // slots κλειδωμένα από τον διαχειριστή («Μη διαθέσιμο»)
let unsubscribe = null;             // listener Firebase για την τρέχουσα ημερομηνία
let demoMode = false;               // true αν δεν έχει ρυθμιστεί το Firebase

/* ── Βοηθητικά ημερομηνιών/ωρών ── */
const pad = n => String(n).padStart(2, "0");
const toStr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromStr = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const toTime = min => `${pad(Math.floor(min/60))}:${pad(min%60)}`;
const isoWeekday = d => d.getDay() === 0 ? 7 : d.getDay();   // 1=Δευ … 7=Κυρ
const prettyDate = s => { const d = fromStr(s);
  return `${d.getDate()} ${MONTHS[d.getMonth()].replace(/ος$/,"ου").replace(/ς$/,"")} ${d.getFullYear()}`; };

/* Είναι η ημερομηνία διαθέσιμη για κράτηση; */
function isBookable(d){
  const s = toStr(d);
  const today = new Date(); today.setHours(0,0,0,0);
  if (d < today) return false;
  if (s < config.dateRange.start || s > config.dateRange.end) return false;
  if (!config.openWeekdays.includes(isoWeekday(d))) return false;
  if ((config.excludedDates || []).includes(s)) return false;
  const ov = (config.dateOverrides || {})[s];
  if (ov && ov.closed) return false;
  return true;
}

/* Παραγωγή slots για μια ημερομηνία (με τυχόν override) */
function slotsForDate(dateStr){
  const ov = (config.dateOverrides || {})[dateStr] || {};
  const start = toMin(ov.start || config.hours.start);
  const end   = toMin(ov.end   || config.hours.end);
  const step  = ov.slotMinutes || config.slotMinutes;
  const out = [];
  for (let t = start; t + step <= end; t += step){
    out.push({ id: toTime(t).replace(":","-"), start: toTime(t), end: toTime(t+step) });
  }
  return out;
}

/* ── Ημερολόγιο ── */
function renderCalendar(){
  $("monthLabel").textContent = `${MONTHS[viewMonth]} ${viewYear}`;

  const first = new Date(viewYear, viewMonth, 1);
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const lead = isoWeekday(first) - 1;            // κενά πριν την 1η (εβδομάδα από Δευτέρα)

  let html = "<tr>" + DAYS.map(d=>`<th>${d}</th>`).join("") + "</tr><tr>";
  for (let i=0; i<lead; i++) html += "<td></td>";
  const todayStr = toStr(new Date());
  for (let day=1; day<=daysInMonth; day++){
    const d = new Date(viewYear, viewMonth, day);
    const s = toStr(d);
    if ((lead + day - 1) % 7 === 0 && day !== 1) html += "</tr><tr>";
    const cls = [ s===todayStr ? "today":"", s===selectedDate ? "active":"" ].join(" ").trim();
    html += `<td><button type="button" data-date="${s}" class="${cls}"
              ${isBookable(d) ? "" : "disabled"}>${day}</button></td>`;
  }
  html += "</tr>";
  $("calendar").innerHTML = html;

  $("calendar").querySelectorAll("button[data-date]:not(:disabled)").forEach(btn =>
    btn.addEventListener("click", () => selectDate(btn.dataset.date)));

  /* Όρια πλοήγησης μηνών μέσα στο εύρος του config */
  const [sy,sm] = config.dateRange.start.split("-").map(Number);
  const [ey,em] = config.dateRange.end.split("-").map(Number);
  $("prevMonth").disabled = (viewYear < sy) || (viewYear === sy && viewMonth <= sm-1);
  $("nextMonth").disabled = (viewYear > ey) || (viewYear === ey && viewMonth >= em-1);
}

function shiftMonth(delta){
  viewMonth += delta;
  if (viewMonth < 0){ viewMonth = 11; viewYear--; }
  if (viewMonth > 11){ viewMonth = 0; viewYear++; }
  renderCalendar();
}

/* ── Επιλογή ημερομηνίας → φόρτωση διαθεσιμότητας ── */
function selectDate(dateStr){
  selectedDate = dateStr;
  selectedSlots.clear();
  takenSlots = new Set();
  $("pickedDate").textContent = prettyDate(dateStr);
  hideMsg();
  renderCalendar();

  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  if (demoMode){ renderSlots(); return; }

  unsubscribe = onValue(ref(db, `bookings/${dateStr}`), snap => {
    const val = snap.val() || {};
    takenSlots = new Set(Object.keys(val));
    blockedSlots = new Set(Object.entries(val).filter(([,b]) => b.blocked).map(([id]) => id));
    selectedSlots.forEach(id => { if (takenSlots.has(id)) selectedSlots.delete(id); });
    renderSlots();
  }, () => {
    $("slotGrid").innerHTML = `<p class="empty-hint">Σφάλμα σύνδεσης με τη βάση. Έλεγξε τις ρυθμίσεις Firebase.</p>`;
  });
}

/* ── Slot grid ── */
function renderSlots(){
  const slots = slotsForDate(selectedDate);
  if (!slots.length){
    $("slotGrid").innerHTML = `<p class="empty-hint">Δεν ορίζονται slots για αυτή την ημερομηνία.</p>`;
    updateForm(); return;
  }
  $("slotGrid").innerHTML = slots.map(sl => {
    const taken   = takenSlots.has(sl.id);
    const blocked = blockedSlots.has(sl.id);
    const sel     = selectedSlots.has(sl.id);
    return `<button type="button" class="slot ${sel?"selected":""} ${blocked?"blocked":""}"
             data-id="${sl.id}" data-start="${sl.start}" data-end="${sl.end}" ${taken?"disabled":""}
             ${taken ? `title="${blocked ? "Μη διαθέσιμο" : "Κατειλημμένο"}"` : ""}>${
             blocked ? "✕ " : ""}${sl.start}–${sl.end}</button>`;
  }).join("");

  $("slotGrid").querySelectorAll(".slot:not(:disabled)").forEach(btn =>
    btn.addEventListener("click", () => toggleSlot(btn.dataset.id)));
  updateForm();
}

function toggleSlot(id){
  if (selectedSlots.has(id)) selectedSlots.delete(id);
  else {
    if (selectedSlots.size >= config.maxSlotsPerBooking){
      showMsg("err", `Έως ${config.maxSlotsPerBooking} slots ανά κράτηση.`); return;
    }
    selectedSlots.add(id);
  }
  hideMsg();
  renderSlots();
}

/* ── Φόρμα ── */
function updateForm(){
  const list = [...selectedSlots].sort();
  $("chips").innerHTML = list.map(id =>
    `<span class="chip">${id.replace("-",":")}</span>`).join("");
  const n = list.length;
  $("submitBtn").textContent = n ? `Κράτηση ${n} slot${n>1?"s":""}` : "Κράτηση";
  $("submitBtn").disabled = demoMode || n === 0;
}

function showMsg(kind, html){ const m = $("msg"); m.className = `msg ${kind}`; m.innerHTML = html; }
function hideMsg(){ const m = $("msg"); m.className = "msg"; m.innerHTML = ""; }

async function submitBooking(e){
  e.preventDefault();
  const name  = $("name").value.trim();
  const email = $("email").value.trim();
  const phone = $("phone").value.trim();

  if (!name) return showMsg("err", "Το ονοματεπώνυμο είναι υποχρεωτικό.");
  const f = config.fields || {};
  if (f.email?.required && !email) return showMsg("err", "Το email είναι υποχρεωτικό.");
  if (f.phone?.required && !phone) return showMsg("err", "Το τηλέφωνο είναι υποχρεωτικό.");
  if (!selectedDate || selectedSlots.size === 0)
    return showMsg("err", "Επίλεξε τουλάχιστον ένα slot.");

  $("submitBtn").disabled = true;
  const wanted = [...selectedSlots].sort();
  const okSlots = [], lostSlots = [];
  const code = genCode();   // ένας κωδικός διαχείρισης για όλη την υποβολή

  /* Κάθε slot γράφεται με transaction: μόνο αν είναι ακόμα ελεύθερο.
     Έτσι δύο άτομα δεν μπορούν να κλείσουν ταυτόχρονα το ίδιο slot.
     Το ts (χρόνος έναρξης του slot) χρησιμοποιείται από τους κανόνες
     του Firebase για το όριο ακύρωσης. */
  for (const id of wanted){
    const start = id.replace("-",":");
    const slot  = slotsForDate(selectedDate).find(s => s.id === id);
    try{
      const res = await runTransaction(ref(db, `bookings/${selectedDate}/${id}`), cur =>
        cur === null
          ? { name, email, phone, start, end: slot ? slot.end : "",
              code, ts: slotTs(selectedDate, start), createdAt: Date.now() }
          : undefined);
      (res.committed ? okSlots : lostSlots).push(start);
    }catch(err){
      lostSlots.push(start + " (σφάλμα)");
    }
  }

  selectedSlots.clear();
  updateForm();
  $("submitBtn").disabled = false;

  const codeNote = `Κωδικός διαχείρισης: <span class="code-big">${code}</span><br>
      Φύλαξέ τον — με αυτόν μπορείς να δεις ή να ακυρώσεις την κράτησή σου
      (έως ${editDays()} μέρες πριν την ημερομηνία της).`;

  if (okSlots.length && !lostSlots.length){
    showMsg("ok", `✔ Η κράτηση καταχωρήθηκε για <strong>${prettyDate(selectedDate)}</strong>:
      <ul>${okSlots.map(s=>`<li class="mono">${s}</li>`).join("")}</ul>${codeNote}`);
    $("bookingForm").reset();
  } else if (okSlots.length){
    showMsg("err", `Καταχωρήθηκαν: <span class="mono">${okSlots.join(", ")}</span>.
      Τα εξής κλείστηκαν μόλις από άλλον: <span class="mono">${lostSlots.join(", ")}</span> —
      διάλεξε άλλο slot.<br>${codeNote}`);
  } else {
    showMsg("err", `Τα slots που επέλεξες μόλις κλείστηκαν από άλλον
      (<span class="mono">${lostSlots.join(", ")}</span>). Διάλεξε άλλα.`);
  }
}

/* ── Διαχείριση κράτησης με κωδικό ── */
const editDays = () => config.editDaysBefore ?? 2;
const editMs = () => editDays() * 86400000;

/* Χρονική στιγμή έναρξης ενός slot (ms) */
function slotTs(dateStr, time){
  const [y,m,d] = dateStr.split("-").map(Number);
  const [hh,mm] = time.split(":").map(Number);
  return new Date(y, m-1, d, hh, mm).getTime();
}

/* Τυχαίος κωδικός 8 χαρακτήρων (χωρίς 0/O/1/I για ευανάγνωστο αποτέλεσμα) */
function genCode(){
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  const b = crypto.getRandomValues(new Uint8Array(8));
  const s = [...b].map(x => A[x % 32]).join("");
  return s.slice(0,4) + "-" + s.slice(4);
}

async function findMine(){
  const box = $("manageResults");
  if (demoMode){ box.innerHTML = `<p class="empty-hint">Ρύθμισε πρώτα το Firebase στο config.json.</p>`; return; }
  let code = $("manageCode").value.trim().toUpperCase();
  if (code.length === 8 && !code.includes("-")) code = code.slice(0,4) + "-" + code.slice(4);
  if (!code){ box.innerHTML = `<p class="empty-hint">Γράψε τον κωδικό διαχείρισης που πήρες κατά την κράτηση.</p>`; return; }

  box.innerHTML = `<p class="empty-hint">Αναζήτηση…</p>`;
  let data;
  try{ data = (await get(ref(db, "bookings"))).val() || {}; }
  catch{ box.innerHTML = `<p class="empty-hint">Σφάλμα σύνδεσης με τη βάση.</p>`; return; }

  const mine = [];
  for (const [date, slots] of Object.entries(data))
    for (const [id, b] of Object.entries(slots)){
      const start = b.start || id.replace("-",":");
      const ts = b.ts || slotTs(date, start);
      if (b.code === code && ts > Date.now()) mine.push({ date, id, start, end: b.end || "", ts });
    }
  mine.sort((a,b) => a.ts - b.ts);

  if (!mine.length){
    box.innerHTML = `<p class="empty-hint">Δεν βρέθηκαν επερχόμενες κρατήσεις με αυτόν τον κωδικό.</p>`;
    return;
  }
  box.innerHTML = mine.map(m => `<div class="m-item">
      <span class="when">${prettyDate(m.date)} · ${m.start}${m.end ? "–"+m.end : ""}</span>
      ${m.ts - Date.now() > editMs()
        ? `<button type="button" class="m-cancel" data-date="${m.date}" data-id="${m.id}">Ακύρωση</button>`
        : `<span class="m-locked">δεν αλλάζει πλέον (λιγότερο από ${editDays()} μέρες)</span>`}
    </div>`).join("");
  box.querySelectorAll(".m-cancel").forEach(btn =>
    btn.addEventListener("click", () => cancelSlot(btn.dataset.date, btn.dataset.id)));
}

async function cancelSlot(date, id){
  if (!confirm(`Ακύρωση του slot ${id.replace("-",":")} στις ${prettyDate(date)};`)) return;
  try{
    await remove(ref(db, `bookings/${date}/${id}`));
    findMine();   // ανανέωση της λίστας — το πλέγμα διαθεσιμότητας ενημερώνεται μόνο του
  }catch(err){
    alert(`Η ακύρωση δεν επιτρέπεται πλέον (απομένουν λιγότερο από ${editDays()} μέρες) ή υπήρξε σφάλμα σύνδεσης.`);
  }
}

/* ── Εκκίνηση ── */
async function init(){
  try{
    config = await (await fetch("config.json", { cache:"no-store" })).json();
  }catch(err){
    document.querySelector(".wrap").innerHTML =
      "<p>Δεν βρέθηκε το config.json. Αν άνοιξες το αρχείο τοπικά (file://), δοκίμασε μέσω GitHub Pages ή τοπικού server.</p>";
    return;
  }

  $("title").textContent = config.title || "Κρατήσεις";
  document.title = `${config.title || "Κρατήσεις"} — ${config.subtitle || ""}`;
  $("subtitle").textContent = config.subtitle || "";
  $("notes").textContent = config.notes || "";
  $("limitLabel").textContent = `έως ${config.maxSlotsPerBooking} slots / κράτηση`;
  const f = config.fields || {};
  if (f.email?.show === false) $("emailField").style.display = "none";
  if (f.phone?.show === false) $("phoneField").style.display = "none";
  if (f.email?.required) $("emailField").querySelector("label").textContent += " *";
  if (f.phone?.required) $("phoneField").querySelector("label").textContent += " *";

  /* Firebase — αν δεν έχει ρυθμιστεί, demo mode με ενημερωτικό banner */
  if (!config.firebase || /ΒΑΛΕ/.test(config.firebase.apiKey || "")){
    demoMode = true;
    $("setupBanner").style.display = "block";
  } else {
    db = getDatabase(initializeApp(config.firebase));
  }

  /* Το ημερολόγιο ξεκινά στον πρώτο μήνα με διαθέσιμες ημερομηνίες */
  const today = new Date(); today.setHours(0,0,0,0);
  const start = fromStr(config.dateRange.start);
  const view = today > start ? today : start;
  viewYear = view.getFullYear(); viewMonth = view.getMonth();

  $("prevMonth").addEventListener("click", () => shiftMonth(-1));
  $("nextMonth").addEventListener("click", () => shiftMonth(1));
  $("bookingForm").addEventListener("submit", submitBooking);

  $("manageHint").textContent =
    `Γράψε τον κωδικό διαχείρισης που πήρες κατά την κράτηση για να δεις τα slots σου ` +
    `ή να τα ακυρώσεις — έως ${editDays()} μέρες πριν την ημερομηνία τους. ` +
    `Για αλλαγή ώρας, ακύρωσε το slot και κλείσε νέο από πάνω.`;
  $("manageFind").addEventListener("click", findMine);
  $("manageCode").addEventListener("keydown", e => {
    if (e.key === "Enter"){ e.preventDefault(); findMine(); }
  });

  renderCalendar();
}

init();
</script>
