<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Αίτηση βιντεοσκόπησης — Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600;700&subset=greek&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot"></span>Studio Βιντεοσκόπησης</div>
  <div class="session-title" id="topSessionTitle"></div>
  <div class="spacer"></div>
  <nav>
    <a href="index.html" class="active">Αίτηση</a>
    <a href="schedule.html">Χρονοπρογραμματισμός</a>
    <a href="login.html">Διαχείριση</a>
  </nav>
</header>

<main class="wrap narrow">
  <h1>Αίτηση βιντεοσκόπησης</h1>
  <p class="sub">Συμπληρώστε τα στοιχεία σας με το ιδρυματικό σας email. Μόλις εγκριθεί το αίτημα, θα λάβετε email με τον σύνδεσμο της σελίδας χρονοπρογραμματισμού και τον προσωπικό σας κωδικό εισόδου.</p>
  <div class="card">
    <div id="reqMsg" class="msg-ok hidden"></div>
    <form id="formRequest">
      <label for="reqName">Ονοματεπώνυμο</label>
      <input type="text" id="reqName" required autocomplete="name">
      <label for="reqEmail">Ιδρυματικό email</label>
      <input type="email" id="reqEmail" required autocomplete="email" placeholder="onoma@uniwa.gr">
      <label for="reqDept">Τμήμα / Μονάδα</label>
      <input type="text" id="reqDept">
      <label for="reqNotes">Περιγραφή αιτήματος</label>
      <textarea id="reqNotes" placeholder="Τι θέλετε να βιντεοσκοπήσετε, εκτιμώμενη διάρκεια κ.λπ."></textarea>
      <div class="btn-row">
        <button class="btn" type="submit">Υποβολή αίτησης</button>
        <button class="btn secondary" type="button" onclick="location.href='schedule.html'">Έχω ήδη κωδικό</button>
      </div>
    </form>
  </div>
</main>

<div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/config.js"></script>
<script src="assets/common.js"></script>
<script>
watchData(render);

function render() {
  const m = $("reqMsg"), f = $("formRequest");
  if (!S.sessionId) {
    f.classList.add("hidden");
    m.className = "msg-err";
    m.textContent = "Δεν υπάρχει ενεργή περίοδος βιντεοσκοπήσεων αυτή τη στιγμή.";
  } else if (m.className === "msg-err") {
    f.classList.remove("hidden");
    m.className = "msg-ok hidden";
  }
}

$("formRequest").addEventListener("submit", async e => {
  e.preventDefault();
  if (!S.sessionId) return;
  const email = normEmail($("reqEmail").value);
  const dup = Object.values(S.requests).some(r => normEmail(r.email) === email && r.status !== "rejected");
  if (dup) { toast("Υπάρχει ήδη αίτημα με αυτό το email.", true); return; }
  try {
    await db.ref(`sessions/${S.sessionId}/requests`).push({
      name: $("reqName").value.trim(),
      email,
      dept: $("reqDept").value.trim(),
      notes: $("reqNotes").value.trim(),
      status: "pending",
      createdAt: Date.now()
    });
    $("formRequest").reset();
    const m = $("reqMsg");
    m.className = "msg-ok";
    m.textContent = "Το αίτημά σας καταχωρήθηκε. Θα λάβετε email με τα στοιχεία εισόδου μόλις εγκριθεί.";
    toast("Το αίτημα υποβλήθηκε.");
  } catch (err) { toast("Σφάλμα κατά την υποβολή. Δοκιμάστε ξανά.", true); }
});
</script>
</body>
</html>
